seed: 42
models:
  separate: true
  policy:
    class: GaussianMixin
    clip_actions: false
    clip_log_std: true
    min_log_std: -3.0
    max_log_std: 1.0
    initial_log_std: -0.22
    fixed_log_std: false
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 512
      - 256
      - 128
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: STATES
      layers:
      - 512
      - 256
      - 128
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 0.001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  observation_preprocessor: RunningStandardScaler
  observation_preprocessor_kwargs: null
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: true
  experiment:
    directory: /opt/isaac/projects/arti_h1_light/logs/skrl/arti_h1_velocity
    experiment_name: 2026-11-13_13-48-45_ppo_torch
    write_interval: 240
    checkpoint_interval: 6000
trainer:
  class: SequentialTrainer
  timesteps: 240000
  environment_info: log
  close_environment_at_exit: false
